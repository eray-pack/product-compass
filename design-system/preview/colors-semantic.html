<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div class="row" style="gap:10px">
    <div class="swatch" style="background: oklch(0.62 0.24 25); color: white;">
      <div><div class="name">destructive</div><div style="font-size:10px;opacity:.9">Active urge · relapse</div></div>
      <div class="value">oklch(.62 .24 25)</div>
    </div>
    <div class="swatch" style="background: oklch(0.70 0.16 150); color: oklch(0.15 0.01 260);">
      <div><div class="name">success</div><div style="font-size:10px;opacity:.85">Completed · check-in done</div></div>
      <div class="value">oklch(.70 .16 150)</div>
    </div>
    <div class="swatch" style="background: oklch(0.78 0.16 70); color: oklch(0.15 0.01 260);">
      <div><div class="name">warning</div><div style="font-size:10px;opacity:.85">XP · coins · caution</div></div>
      <div class="value">oklch(.78 .16 70)</div>
    </div>
  </div>
  <div class="row" style="gap:8px; margin-top:4px">
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; border: 1px solid oklch(0.62 0.24 25 / 0.5); background: oklch(0.62 0.24 25 / 0.12); color: oklch(0.62 0.24 25); font-size:10px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;">● Active urge</span>
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; border: 1px solid oklch(0.78 0.16 70 / 0.3); background: oklch(0.78 0.16 70 / 0.08); color: oklch(0.78 0.16 70); font-size:11px; font-weight:700;">⊙ 240 XP</span>
  </div>
</div></body></html>
