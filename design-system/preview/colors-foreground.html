<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div class="row" style="gap:10px">
    <div class="swatch" style="background: oklch(0.96 0.005 260); color: oklch(0.10 0.01 260);">
      <div><div class="name">foreground</div></div><div class="value">oklch(.96 .005 260)</div>
    </div>
    <div class="swatch" style="background: oklch(0.60 0.018 265); color: oklch(0.10 0.01 260);">
      <div><div class="name">muted-foreground</div></div><div class="value">oklch(.60 .018 265)</div>
    </div>
    <div class="swatch" style="background: oklch(0.42 0.018 265); color: white;">
      <div><div class="name">muted-foreground / dim</div></div><div class="value">oklch(.42 .018 265)</div>
    </div>
  </div>
  <div style="background: oklch(0.13 0.022 265); border-radius:14px; padding:14px; border: 1px solid oklch(0.22 0.03 265);">
    <div style="color: oklch(0.96 0.005 260); font-size:14px; font-weight:600;">Foreground — primary text on cards.</div>
    <div style="color: oklch(0.60 0.018 265); font-size:13px; margin-top:4px;">Muted — supporting body, helper text.</div>
    <div style="color: oklch(0.42 0.018 265); font-size:11px; font-style:italic; margin-top:4px;">Dim — italic muted, decorative quotes.</div>
  </div>
</div></body></html>
