<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div class="row" style="gap:10px">
    <div class="swatch" style="background: oklch(0.62 0.22 255); color: white;">
      <div><div class="name">primary</div><div style="font-size:10px;opacity:.85">Identity · CTAs · progress</div></div>
      <div class="value">oklch(.62 .22 255)</div>
    </div>
    <div class="swatch" style="background: oklch(0.72 0.20 255); color: white;">
      <div><div class="name">primary-glow</div><div style="font-size:10px;opacity:.85">Hover lift</div></div>
      <div class="value">oklch(.72 .20 255)</div>
    </div>
  </div>
  <div class="row" style="gap:10px">
    <div class="swatch" style="background: oklch(0.62 0.22 255 / 0.10); color: oklch(0.62 0.22 255); border-color: oklch(0.62 0.22 255 / 0.30);">
      <div><div class="name">primary / 10</div><div style="font-size:10px;opacity:.85">Selected pill / chip</div></div>
      <div class="value">tint 10%</div>
    </div>
    <div class="swatch" style="background: oklch(0.62 0.22 255 / 0.05); color: oklch(0.72 0.20 255); border-color: oklch(0.62 0.22 255 / 0.20);">
      <div><div class="name">primary / 5</div><div style="font-size:10px;opacity:.85">Affirmation card</div></div>
      <div class="value">tint 5%</div>
    </div>
  </div>
  <div style="margin-top:auto; height: 56px; border-radius:14px; background: linear-gradient(135deg, oklch(0.62 0.22 255), oklch(0.52 0.24 265)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; box-shadow: 0 0 40px -10px oklch(0.62 0.22 255 / 0.55);">
    --gradient-primary
  </div>
</div></body></html>
