<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div style="display:flex; flex-direction:column; gap:10px">
    <button style="height:56px; border-radius:16px; background: linear-gradient(135deg, oklch(0.62 0.22 255), oklch(0.52 0.24 265)); color:white; font: 700 14px 'Space Grotesk'; border:none; box-shadow: 0 0 40px -10px oklch(0.62 0.22 255 / 0.55); display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      This is who I'm becoming →
    </button>
    <button style="height:56px; border-radius:16px; background: oklch(0.62 0.22 255 / 0.15); color: oklch(0.62 0.22 255); border: 1px solid oklch(0.62 0.22 255 / 0.35); font: 600 14px 'Space Grotesk'; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      ⚡ Feeling an urge? Open SOS →
    </button>
    <button style="height:56px; border-radius:16px; background: oklch(0.13 0.022 265); border: 1px solid oklch(0.22 0.03 265 / 0.4); color: oklch(0.60 0.018 265); font: 500 14px 'Space Grotesk'; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      ⚠ I relapsed — log it honestly
    </button>
    <button disabled style="height:56px; border-radius:16px; background: oklch(0.22 0.03 265); color: white; font: 700 14px 'Space Grotesk'; border:none; opacity:0.25; cursor:not-allowed;">
      Pick an option
    </button>
  </div>
</div></body></html>
