<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div style="display:flex; flex-direction:column; gap:10px">
    <button style="text-align:left; padding:14px 20px; border-radius:16px; border:2px solid oklch(0.62 0.22 255); background: oklch(0.62 0.22 255 / 0.10); color: oklch(0.96 0.005 260); font: 600 14px 'Space Grotesk'; display:flex; align-items:center; gap:14px; cursor:pointer;">
      <span style="height:20px; width:20px; border-radius:9999px; border:2px solid oklch(0.62 0.22 255); display:inline-flex; align-items:center; justify-content:center;"><span style="height:10px; width:10px; border-radius:9999px; background: oklch(0.62 0.22 255);"></span></span>
      I am someone who <span style="color: oklch(0.62 0.22 255);">is in full control of his mind</span>
    </button>
    <button style="text-align:left; padding:14px 20px; border-radius:16px; border:2px solid oklch(0.22 0.03 265); background: oklch(0.13 0.022 265); color: oklch(0.60 0.018 265); font: 500 14px 'Space Grotesk'; display:flex; align-items:center; gap:14px; cursor:pointer;">
      <span style="height:20px; width:20px; border-radius:9999px; border:2px solid oklch(0.60 0.018 265);"></span>
      I am someone who chooses discomfort over instant gratification
    </button>
    <button style="text-align:left; padding:14px 20px; border-radius:16px; border:2px solid oklch(0.62 0.22 255); background: oklch(0.62 0.22 255 / 0.10); color: oklch(0.96 0.005 260); font: 600 14px 'Space Grotesk'; display:flex; align-items:center; gap:12px; cursor:pointer;">
      <span style="height:20px; width:20px; border-radius:6px; border:2px solid oklch(0.62 0.22 255); background: oklch(0.62 0.22 255); display:inline-flex; align-items:center; justify-content:center; color:white; font-size:13px;">✓</span>
      Self-confidence
    </button>
  </div>
</div></body></html>
