        <div style="font:700 20px 'Space Grotesk'; color: oklch(0.62 0.22 255); font-variant-numeric: tabular-nums;">52%</div>
        <div style="font-size:10px; color: oklch(0.60 0.018 265); font-weight:500; margin-top:2px;">Recovery</div>
      </div>
      <div style="flex:1; border-radius:16px; padding:10px; border:1px solid oklch(0.22 0.03 265); background: linear-gradient(180deg, oklch(0.13 0.022 265), oklch(0.09 0.02 265)); text-align:center;">
        <div style="font:700 20px 'Space Grotesk'; color: oklch(0.62 0.22 255); font-variant-numeric: tabular-nums;">47d</div>
        <div style="font-size:10px; color: oklch(0.60 0.018 265); font-weight:500; margin-top:2px;">Best Streak</div>
      </div>
    </div>
  </div>
