<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div style="display:flex; gap:20px; align-items:center; justify-content:center; flex:1; padding: 12px 0;">
    <div style="text-align:center">
      <div style="height:64px; width:64px; border-radius:16px; background: linear-gradient(135deg, oklch(0.62 0.22 255), oklch(0.52 0.24 265)); box-shadow: 0 0 40px -10px oklch(0.62 0.22 255 / 0.55);"></div>
      <div style="font-size:10px; color: oklch(0.60 0.018 265); margin-top:8px; font-weight:600;">--shadow-glow</div>
      <div style="font-size:9px; color: oklch(0.42 0.018 265); font-family: ui-monospace, monospace;">primary CTAs</div>
    </div>
    <div style="text-align:center">
      <div style="height:64px; width:64px; border-radius:16px; background: oklch(0.62 0.24 25); box-shadow: 0 0 60px -10px oklch(0.62 0.24 25 / 0.6);"></div>
      <div style="font-size:10px; color: oklch(0.60 0.018 265); margin-top:8px; font-weight:600;">--shadow-sos</div>
      <div style="font-size:9px; color: oklch(0.42 0.018 265); font-family: ui-monospace, monospace;">emergency states</div>
    </div>
    <div style="text-align:center">
      <div style="height:64px; width:64px; border-radius:16px; background: oklch(0.13 0.022 265); border:1px solid oklch(0.22 0.03 265);"></div>
      <div style="font-size:10px; color: oklch(0.60 0.018 265); margin-top:8px; font-weight:600;">flat card</div>
      <div style="font-size:9px; color: oklch(0.42 0.018 265); font-family: ui-monospace, monospace;">no shadow, just border</div>
    </div>
  </div>
  <div style="font-size:10px; color: oklch(0.42 0.018 265); text-align:center; font-style:italic;">Stopamine uses glows, never drop shadows.</div>
</div></body></html>
