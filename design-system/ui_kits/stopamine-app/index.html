<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stopamine — UI Kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    body { background: var(--background); margin: 0; min-height: 100vh; }
    @keyframes step-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes breathe-in  { from { transform: scale(1); }    to { transform: scale(1.45); } }
    @keyframes breathe-out { from { transform: scale(1.45); } to { transform: scale(1); } }
    @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 20px -5px oklch(0.62 0.22 255 / 0.5); } 50% { box-shadow: 0 0 40px -5px oklch(0.62 0.22 255 / 0.9); } }
    .stage {
      display: flex; gap: 32px; padding: 32px; align-items: flex-start; justify-content: center;
      flex-wrap: wrap; min-height: 100vh;
    }
    .switcher {
      position: fixed; top: 16px; left: 16px; z-index: 100;
      display: flex; flex-direction: column; gap: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px;
    }
    .switcher button {
      background: transparent; border: none; padding: 8px 14px; border-radius: 10px;
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--muted-foreground);
      text-align: left; cursor: pointer; letter-spacing: .04em;
    }
    .switcher button.active { background: oklch(0.62 0.22 255 / 0.10); color: var(--primary); }
    .device-host {
      width: 393px;
      height: 852px;
      border-radius: 56px;
      overflow: hidden;
      background: var(--background);
      position: relative;
      border: 6px solid #1c1f26;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px oklch(0.22 0.03 265);
    }
    .device-screen { width: 100%; height: 100%; overflow-y: auto; position: relative; }
    .device-screen::-webkit-scrollbar { display: none; }
    .label {
      font-size: 11px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase;
      color: var(--muted-foreground); text-align: center; margin-top: 14px;
    }
    .stack { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Onboarding.jsx"></script>
  <script type="text/babel" src="SOSScreen.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    function App() {
      const [view, setView] = useState("dashboard");
      const [navTab, setNavTab] = useState("home");

      const renderInside = () => {
        if (view === "onboarding") {
          return <Onboarding onDone={() => setView("dashboard")} onBack={() => setView("dashboard")} />;
        }
        if (view === "sos") {
          return <SOSScreen onBack={() => setView("dashboard")} />;
        }
        return (
          <>
            <Dashboard
              onSos={() => setView("sos")}
              onRelapse={() => alert("Relapse modal — would open here.")}
              onSettings={() => alert("Settings — would open here.")}
            />
            <BottomNav active={navTab} onChange={setNavTab} />
          </>
        );
      };

      const buttons = [
        { id: "dashboard", label: "Dashboard" },
        { id: "onboarding", label: "Onboarding" },
        { id: "sos", label: "SOS · Urge surfing" },
      ];

      return (
        <>
          <div className="switcher">
            {buttons.map((b) => (
              <button key={b.id} className={view === b.id ? "active" : ""} onClick={() => setView(b.id)}>{b.label}</button>
            ))}
          </div>
          <div className="stage">
            <div className="stack">
              <div className="device-host">
                <div className="device-screen">
                  {renderInside()}
                </div>
              </div>
              <div className="label">{buttons.find(b => b.id === view).label}</div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
